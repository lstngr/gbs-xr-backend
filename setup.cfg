[metadata]
name = xrtoy
version = 0.1
author = Louis Stenger
author_email = louis.stenger@epfl.ch
description = Toy package to explore implementation of an xarray backend
long_description = file: README.md
long_description_content_type = text/markdown

[options]
include_package_data = True
packages = find:
python_requires = >=3.9
install_requires =
  numpy
  scipy
  h5py
  xarray
  dask[complete]

[options.entry_points]
xarray.backends =
  xrtbasic = xrtoy.xrplugs:XRTBackendEntrypoint

[flake8]
# line length - let black worry about that
max-line-length = 88
ignore =
    E203 # whitespace before ':' - doesn't work well with black
